name: iosApp
options:
  bundleIdPrefix: com.lyihub.archiveassistant
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    INFOPLIST_FILE: iosApp/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.lyihub.archiveassistant
    PRODUCT_NAME: 聚合拾遗
    DEVELOPMENT_TEAM: ""  # 填写你的 Apple Team ID
    CODE_SIGN_STYLE: Manual

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "*.xcodeproj"
          - project.yml
          - Podfile
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
        OTHER_LINKER_FLAGS: "-framework Shared"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    dependencies: []

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    archive:
      config: Release
