name: Build Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: 生成 Compose Resources 访问器
        run: gradle :shared:generateComposeResClass :shared:generateResourceAccessorsForCommonMain --no-daemon --no-build-cache

      - name: 诊断：打印 Res.kt 中 tsieina_department 相关行
        run: |
          RES_KT="shared/build/generated/compose/resourceGenerator/kotlin/com/lyihub/archiveassistant/shared/generated/resources/Res.kt"
          echo "=== Res.kt 文件状态 ==="
          ls -lh "$RES_KT" 2>&1 || echo "Res.kt 不存在！"
          echo ""
          echo "=== 包含 tsieina_department 的行 ==="
          grep -n "tsieina_department" "$RES_KT" 2>&1 || echo "未找到 tsieina_department 相关条目"

      - name: 构建 Android APK (Release)
        run: gradle :androidApp:assembleRelease --no-daemon --no-build-cache

      - name: 查找 APK
        run: find androidApp/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 聚合拾遗-Android-${{ github.sha }}
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 7
