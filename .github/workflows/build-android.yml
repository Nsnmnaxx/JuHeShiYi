name: Build Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: 构建 Android APK (Release) + 诊断 Res.kt
        run: |
          gradle :shared:generateComposeResClass :shared:generateResourceAccessorsForCommonMain :androidApp:assembleRelease --no-daemon --no-build-cache
          echo "=== 搜索所有 Res.kt ==="
          find shared/build -name "Res.kt" -type f 2>/dev/null
          echo "=== Res.kt 内容（tsieina_department 行）==="
          find shared/build -name "Res.kt" -type f -exec grep -n "tsieina_department" {} + 2>/dev/null || echo "未找到 tsieina_department 条目"

      - name: 查找 APK
        run: find androidApp/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: 聚合拾遗-Android-${{ github.sha }}
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 7
