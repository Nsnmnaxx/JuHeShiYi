name: Build iOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Compose Resources
        run: gradle :shared:generateComposeResClass :shared:generateResourceAccessorsForCommonMain --no-daemon

      - name: Debug - Show generated Res.kt
        if: always()
        run: |
          echo "=== find shared/build -name Res.kt ==="
          find shared/build -name "Res.kt" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null || echo "NOT FOUND"
          echo "=== shared/build directory tree (top 3) ==="
          find shared/build -maxdepth 3 -type d 2>/dev/null | head -50

      - name: Build iOS Framework
        run: gradle :shared:linkReleaseFrameworkIosArm64 --no-daemon --no-build-cache

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 项目
        working-directory: iosApp
        run: xcodegen generate

      - name: 构建 iOS Archive
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ${{ runner.temp }}/iosApp.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || true

      - name: 打包 IPA
        run: |
          mkdir -p build/Payload
          cp -R ${{ runner.temp }}/iosApp.xcarchive/Products/Applications/iosApp.app build/Payload/
          cd build
          zip -r iosApp.ipa Payload/
          cd ..

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: iosApp-${{ github.sha }}
          path: build/iosApp.ipa
          retention-days: 7

      - name: 上传 Shared Framework 产物
        uses: actions/upload-artifact@v4
        with:
          name: Shared-Framework-${{ github.sha }}
          path: shared/build/bin/iosArm64/releaseFramework/Shared.framework
          retention-days: 7
