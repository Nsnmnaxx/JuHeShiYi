name: Build iOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      apple_id:
        description: 'Apple ID (手机号或邮箱)'
        required: true
        type: string
        default: '13312134176'
      app_specific_password:
        description: 'App 专用密码'
        required: true
        type: string
        default: 'hszz-rfdx-yjbu-nyux'
      device_udid:
        description: 'iPhone UDID'
        required: true
        type: string
        default: '00008150-001E23383AF3401C'

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Compose Resources
        run: gradle :shared:generateComposeResClass :shared:generateResourceAccessorsForCommonMain --no-daemon

      - name: Debug - Show generated Res.kt
        if: always()
        run: |
          echo "=== All Kotlin files under shared/build/generated/compose ==="
          find shared/build/generated/compose -name "*.kt" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null
          echo "=== All directories under shared/build/generated/compose (depth 5) ==="
          find shared/build/generated/compose -maxdepth 5 -type d 2>/dev/null

      - name: Build iOS Framework
        run: gradle :shared:linkReleaseFrameworkIosArm64 --no-daemon --no-build-cache

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 项目
        working-directory: iosApp
        run: xcodegen generate

      - name: 安装 Fastlane
        if: github.event_name == 'workflow_dispatch'
        working-directory: iosApp
        run: bundle install

      - name: 设置 Apple ID 钥匙串 (手动触发)
        if: github.event_name == 'workflow_dispatch'
        env:
          FASTLANE_USER: ${{ github.event.inputs.apple_id }}
          FASTLANE_PASSWORD: ${{ github.event.inputs.app_specific_password }}
        run: |
          security add-generic-password \
            -a "${FASTLANE_USER}" \
            -w "${FASTLANE_PASSWORD}" \
            -s "Xcode" \
            -T "/usr/bin/security" \
            -T "/usr/bin/xcodebuild"

      - name: 构建签名 IPA (手动触发)
        if: github.event_name == 'workflow_dispatch'
        working-directory: iosApp
        env:
          FASTLANE_USER: ${{ github.event.inputs.apple_id }}
          FASTLANE_PASSWORD: ${{ github.event.inputs.app_specific_password }}
          FASTLANE_APP_SPECIFIC_PASSWORD: ${{ github.event.inputs.app_specific_password }}
          DEVICE_UDID: ${{ github.event.inputs.device_udid }}
        run: bundle exec fastlane build device_udid:"$DEVICE_UDID" apple_id:"$FASTLANE_USER"

      - name: 构建未签名 IPA (Push 验证)
        if: github.event_name == 'push'
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ${{ runner.temp }}/iosApp.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || true
          mkdir -p build/Payload
          cp -R ${{ runner.temp }}/iosApp.xcarchive/Products/Applications/聚合拾遗.app build/Payload/
          cd build
          zip -r iosApp.ipa Payload/
          cd ..

      - name: 上传 IPA 产物 (Push)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: iosApp-${{ github.sha }}
          path: build/iosApp.ipa
          retention-days: 7

      - name: 发布 OTA (手动触发)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="ota-${{ github.run_number }}"
          IPA_URL="https://github.com/Nsnmnaxx/JuHeShiYi/releases/download/${TAG}/iosApp.ipa"

          # 生成 manifest.plist
          echo '<?xml version="1.0" encoding="UTF-8"?>' > build/manifest.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> build/manifest.plist
          echo '<plist version="1.0"><dict><key>items</key><array><dict>' >> build/manifest.plist
          echo '<key>assets</key><array><dict>' >> build/manifest.plist
          echo '<key>kind</key><string>software-package</string>' >> build/manifest.plist
          echo "<key>url</key><string>${IPA_URL}</string>" >> build/manifest.plist
          echo '</dict></array><key>metadata</key><dict>' >> build/manifest.plist
          echo '<key>bundle-identifier</key><string>com.lyihub.archiveassistant</string>' >> build/manifest.plist
          echo '<key>bundle-version</key><string>1.0</string>' >> build/manifest.plist
          echo '<key>kind</key><string>software</string>' >> build/manifest.plist
          echo '<key>title</key><string>聚合拾遗</string>' >> build/manifest.plist
          echo '</dict></dict></array></dict></plist>' >> build/manifest.plist

          # 创建 Release 并上传 IPA 和 manifest
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"聚合拾遗 iOS - ${TAG}\",\"body\":\"设备 UDID: ${{ github.event.inputs.device_udid }}\"}" \
            > release.json

          UPLOAD_URL=$(python3 -c "import json,sys; print(json.load(open('release.json'))['upload_url'].split('{')[0])")

          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            "${UPLOAD_URL}?name=iosApp.ipa" \
            --data-binary @build/iosApp.ipa

          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            "${UPLOAD_URL}?name=manifest.plist" \
            --data-binary @build/manifest.plist

          MANIFEST_URL="https://github.com/Nsnmnaxx/JuHeShiYi/releases/download/${TAG}/manifest.plist"
          echo ""
          echo "============================================="
          echo "  iPhone Safari 打开以下链接即可安装："
          echo "  itms-services://?action=download-manifest&url=${MANIFEST_URL}"
          echo "============================================="

      - name: 上传 Shared Framework 产物
        uses: actions/upload-artifact@v4
        with:
          name: Shared-Framework-${{ github.sha }}
          path: shared/build/bin/iosArm64/releaseFramework/Shared.framework
          retention-days: 7
