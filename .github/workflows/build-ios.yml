name: Build iOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 构建 Shared Framework (iOS)
        run: |
          chmod +x gradlew
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 项目
        working-directory: iosApp
        run: xcodegen generate

      - name: 构建 iOS Archive
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ${{ runner.temp }}/iosApp.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || true

      - name: 打包 IPA
        run: |
          mkdir -p build/Payload
          cp -R ${{ runner.temp }}/iosApp.xcarchive/Products/Applications/iosApp.app build/Payload/
          cd build
          zip -r iosApp.ipa Payload/
          cd ..

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: iosApp-${{ github.sha }}
          path: build/iosApp.ipa
          retention-days: 7

      - name: 上传 Shared Framework 产物
        uses: actions/upload-artifact@v4
        with:
          name: Shared-Framework-${{ github.sha }}
          path: shared/build/bin/iosArm64/releaseFramework/Shared.framework
          retention-days: 7
